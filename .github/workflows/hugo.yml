name: Deploy Hugo site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  # Pinned to the version the site is developed with locally.
  HUGO_VERSION: 0.157.0
  HUGO_ENVIRONMENT: production
  HUGO_CACHEDIR: ${{ github.workspace }}/../hugo_cache
  TZ: America/Chicago

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Install Hugo extended ${{ env.HUGO_VERSION }}
        run: |
          wget -O "${{ runner.temp }}/hugo.deb" \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          sudo dpkg -i "${{ runner.temp }}/hugo.deb"
          hugo version

      - name: Checkout (full history so enableGitInfo gives real dates)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go from go.mod (the Hextra theme is a Hugo module)
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Set up Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Restore Hugo module cache
        uses: actions/cache@v4
        with:
          path: ${{ env.HUGO_CACHEDIR }}
          key: hugo-modcache-${{ github.run_id }}
          restore-keys: hugo-modcache-

      - name: Restore processed images (resources/_gen)
        uses: actions/cache@v4
        with:
          path: resources/_gen
          key: hugo-resources-${{ github.run_id }}
          restore-keys: hugo-resources-

      - name: Build
        run: |
          hugo --gc --minify --baseURL "${{ steps.pages.outputs.base_url }}/"
          # Fail the build if the placeholder base URL ever leaks into the output.
          ! grep -rIl 'example.org' public

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
